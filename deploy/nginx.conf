# ═══════════════════════════════════════════════════════════
#  Nginx — باشگاه مشتریان پویا
#  مسیر: /etc/nginx/sites-available/pouya-loyalty
# ═══════════════════════════════════════════════════════════

# زمان‌بندی آپلود (مهم برای ورود اکسل)
client_max_body_size 10M;

# حالت SSL را در بخش سرور اصلی فعال کنید
# server {
#     listen 80;
#     server_name club.pouyaplastic.ir;
#     return 301 https://$server_name$request_uri;
# }

server {
    listen 80;
    server_name club.pouyaplastic.ir;  # دامنه خود را جایگزین کنید

    # --- امنیت پایه ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Brotli / Gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --- API Proxy → بک‌اند ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # زمان‌بندی برای آپلود اکسل
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- فایل‌های استاتیک (Cache طولانی) ---
    location /assets/ {
        alias /opt/pouya-loyalty/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Service Worker و PWA ---
    location = /sw.js {
        alias /opt/pouya-loyalty/frontend/dist/sw.js;
        add_header Cache-Control "no-cache";
    }

    location = /sw-push.js {
        alias /opt/pouya-loyalty/frontend/dist/sw-push.js;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        alias /opt/pouya-loyalty/frontend/dist/manifest.webmanifest;
        add_header Cache-Control "no-cache";
        add_header Content-Type "application/manifest+json";
    }

    location = /registerSW.js {
        alias /opt/pouya-loyalty/frontend/dist/registerSW.js;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
        root /opt/pouya-loyalty/frontend/dist;
        add_header Cache-Control "no-cache";
    }

    # --- آیکون‌های PWA ---
    location /icons/ {
        alias /opt/pouya-loyalty/frontend/dist/icons/;
        expires 30d;
        access_log off;
    }

    # --- ریشه → React SPA ---
    location / {
        root /opt/pouya-loyalty/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # --- بلاک مستندات ---
    location ~ /\. { deny all; }
}
